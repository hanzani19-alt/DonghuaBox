name: DonghuaBox APK Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build DonghuaBox Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;25.0.8775105"

          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> "$GITHUB_ENV"

      - name: Restore DonghuaBox Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Secret KEYSTORE_BASE64 belum diatur."
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > donghuabox-release-v2.keystore

      - name: Build LibCore
        run: ./run lib core

      - name: Build DonghuaBox APK
        env:
          BUILD_PLUGIN: none
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/25.0.8775105" >> local.properties

          ./run init action gradle
          ./gradlew app:assembleOssRelease

      - name: Upload DonghuaBox APK
        uses: actions/upload-artifact@v4
        with:
          name: DonghuaBox-Release-arm64
          path: app/build/outputs/apk/oss/release/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 30
